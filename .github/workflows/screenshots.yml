# Instala el APK en un emulador, recorre las pantallas de los tres roles
# y publica las capturas en la rama "capturas" del repositorio.
name: Capturas de pantalla

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capturas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: ./gradlew assembleDebug && cp app/build/outputs/apk/debug/app-debug.apk Patitas_v1.0.0.apk

      - name: Ejecutar en emulador y capturar
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          cores: 4
          ram-size: 4096M
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/capture.sh

      - name: Publicar capturas en la rama capturas
        if: always()
        run: |
          mkdir -p /tmp/out && cp shots/*.png /tmp/out/ || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan capturas
          git rm -rf -q .
          rm -rf shots scripts app gradle .github
          cp /tmp/out/*.png . || true
          git add *.png
          git commit -q -m "Capturas de pantalla de la app"
          git push -f origin capturas
