# Instala el APK en un emulador conectado al Firebase real, recorre las pantallas de los
# tres roles (con GPS simulado y el checkout de ePayco) y publica las capturas en la rama
# "capturas-v2" del repositorio. Se usa para el manual de usuario.
name: Capturas de pantalla

# Se ejecuta a mano o al subir cambios a la rama "capturas-run".
on:
  workflow_dispatch:
  push:
    branches: [ capturas-run ]

permissions:
  contents: write

jobs:
  capturas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        env:
          EPAYCO_PUBLIC_KEY: ${{ secrets.EPAYCO_PUBLIC_KEY }}
          EPAYCO_PRIVATE_KEY: ${{ secrets.EPAYCO_PRIVATE_KEY }}
        run: ./gradlew assembleDebug && cp app/build/outputs/apk/debug/app-debug.apk Patitas.apk

      - name: Ejecutar en emulador y capturar
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          cores: 4
          ram-size: 4096M
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/capture_v2.sh

      - name: Publicar capturas en la rama capturas
        if: always()
        run: |
          mkdir -p /tmp/out && cp shots/*.png /tmp/out/ || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan capturas-v2
          git rm -rf -q .
          rm -rf shots scripts app gradle .github
          cp /tmp/out/*.png . || true
          git add *.png
          git commit -q -m "Capturas de pantalla de la app"
          git push -f origin capturas-v2
